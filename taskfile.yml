version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  GPSP_HOST: vendor/gpsp_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77
  # The cores past the Game Boy family, fetched prebuilt from the libretro buildbot.
  FETCHED: >-
    fceumm snes9x genesis_plus_gx mednafen_pce_fast race mednafen_wswan handy pcsx_rearmed fbneo
    mame2003_plus neocd mednafen_vb pokemini gw picodrive gearsystem
    mednafen_supergrafx mednafen_pcfx stella2014 a5200 prosystem gearcoleco freeintv o2em
    freechaf potator sameduck fmsx bluemsx vice_x64 puae2021 fuse cap32 hatarib atari800 dosbox_pure
    np2kai px68k scummvm retro8 tic80
  # fake-08, the PICO-8 core, and its Lua, a git submodule GitHub's archives leave out; built from
  # source by core:fake08 with cores/fake08's patches.
  FAKE08_COMMIT: 814991a2571ad3970e386cef48f3b148aa1c27b9
  Z8LUA_COMMIT: e6928578d46b61fd5ea30cfcf547e855a30a0553
  # The cores built from source against OpenGL ES, as core:commit: the GPU cores, whose buildbot
  # builds want desktop GL, and vecx, whose buildbot build links it. Nodosumi is not among them:
  # core:nodosumi fetches its latest release.
  # What the Apps open PDFs and videos with: MuPDF's mutool, built from this release, and a
  # static arm64 ffmpeg.
  MUPDF_VERSION: 1.24.10
  FFMPEG_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
  # The bezels a build ships, R. Savant's overlays for the H700's three screen sizes.
  OVERLAYS_COMMIT: e9b5f47ee76c16c6fdfe761f9e726984b85d2d30
  GLES_CORES: >-
    vecx:8f671cc9d737f2890c3ce19e177e2984dcae121f
    parallel_n64:a8280501a71c1bcd4c85c5b8bfe75cfa62cd6127
    flycast:6bb0fc3e18dac4b01694f488c7a71f5930e8a648
  # What libslotcast.so, which casting to a TV runs on, is built from: x264, Opus, mbedTLS and
  # FAAC.
  SLOTCAST: >-
    b35605ace3ddf7c1a5d67a2eb553f034aef41d55 ddbe48383984d56acd9e1ab6a090c54ca6b735a6
    068ff080b369adfac81509f9b57b2afabaf82dc5 6acbe23ac9318d8f731ef38e0a56365f70af4797
  SLOT_IN_PROCESS: >-
    --test bios --test core --test core_options --test e2e --test emu --test gb_palette_recolour --test gpsp
    --test link_ui --test mgba_gb_link --test mgba_link --test render_colour_correction
    --test render_gb_palette --test render_picture_modes --test runahead --test render
    --test render_in_game_menu --test render_power_wake --test render_quick_menu
    --test render_shelf --test render_shelves
  IN_PROCESS: >-
    (package(slot) & (binary(bios) | binary(core) | binary(core_options) | binary(e2e) | binary(emu)
    | binary(gb_palette_recolour) | binary(gpsp) | binary(link_ui) | binary(mgba_gb_link)
    | binary(mgba_link) | binary(render_colour_correction) | binary(render_gb_palette)
    | binary(render_picture_modes) | binary(runahead) | binary(render) | binary(render_in_game_menu)
    | binary(render_power_wake) | binary(render_quick_menu) | binary(render_shelf)
    | binary(render_shelves)))
    | (package(slot-gfx) & binary(pipeline)) | (package(slot-ui) & (binary(render_row_edges) | binary(render_keyboard) | binary(render_trophies)))
    | (package(slot-retro) & (binary(options) | binary(netpacket) | binary(libretro)))

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace
      - tools/target-cap/target-cap.sh

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p slot
      - tools/target-cap/target-cap.sh

  test:
    desc: Run the whole test suite in parallel with cargo-nextest, silent
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace --no-fail-fast -E 'not ({{.IN_PROCESS}})'
      - cargo test -p slot --no-fail-fast {{.SLOT_IN_PROCESS}}
      - cargo test -p slot-gfx --test pipeline
      - cargo test -p slot-ui --test render_row_edges --test render_keyboard --test render_trophies
      - cargo test -p slot-retro --test options --test netpacket --test libretro
      - tools/target-cap/target-cap.sh

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace {{.FILTER}}
      - tools/target-cap/target-cap.sh

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p slot --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:card

  test:card:
    desc: Test the scripts slot ships on the card, off-device
    cmds:
      - sh card/test-slotlink.sh
      - sh card/test-led.sh
      - sh card/test-coresave.sh
      - sh card/test-launch.sh
      - sh card/test-slotwifi.sh
      - sh card/test-slotmiracast.sh
      - sh card/test-slotbt.sh
      - sh card/test-slotservices.sh
      - sh card/test-update.sh
      - sh card/test-portmaster.sh

  core:
    desc: >-
      Build mGBA and fetch gpSP for this host. A missing core silently runs the mock (a test
      pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    status:
      - test -f {{.GPSP_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gpsp-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gpsp_libretro.dylib.zip"
        unzip -o -q vendor/gpsp-host.zip -d vendor
        rm -f vendor/gpsp-host.zip
        file {{.GPSP_HOST}} | grep -q Mach-O
        echo "fetched {{.GPSP_HOST}}"

  core:update:
    desc: Rebuild mGBA and re-fetch gpSP for this host even if they are already vendored
    cmds:
      - rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/slot-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/<SYSTEM> (GBA, GB, GBC, NES, SNES, MD, SMS, GG, PCE, NGP, WS, LYNX, PS), labels in the matching Labels/<SYSTEM>, battery saves in the matching Saves/<SYSTEM>, save states under the matching States/<SYSTEM>, BIOS files (gba_bios.bin, lynxboot.img, PlayStation BIOS) in BIOS, pngs or jpgs in Wallpapers, palette in Config/theme.txt"'
      - 'echo "nothing is moved for you: a file loose at the top of Games/, Saves/, Labels/ or States/ is left where it is and never reaches the shelf"'

  run:
    desc: >-
      Run slot. against SLOT_ROOT, defaults to ./sdcard. SLOT_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p slot

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_BARE: '1'
    cmds:
      - cargo run --release -p slot

  run:4x3:
    desc: Run in a 4:3 window, as on the RG35XXSP, with the bezel around the screen
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_WINDOW: '1280x960'
    cmds:
      - cargo run --release -p slot

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p slot

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [core, release]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/slot --init-root {{.OUT}}
      - cp target/release/slot {{.OUT}}/System/slot
      - cp {{.CORE}} {{.GPSP_HOST}} {{.OUT}}/System/
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:gpsp:
    desc: >-
      Build the aarch64 linux gpSP core from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test "$(cat vendor/gpsp-src.sha 2>/dev/null)" = "{{.GPSP_COMMIT}}"
      - test "$(cat vendor/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
      - test "$(cat vendor/gpsp-src.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta \
              vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
        curl -fsSL -o vendor/gpsp-src.tar.gz \
          "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
        tar -tzf vendor/gpsp-src.tar.gz | grep "^gpsp-{{.GPSP_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gpsp/build.sh build {{.GPSP_COMMIT}} vendor/gpsp-src.tar.gz
            target-device/gpsp vendor/gpsp_libretro.so
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - echo "{{.GPSP_COMMIT}}" > vendor/gpsp-src.sha
      - cp vendor/gpsp_libretro.so.meta vendor/gpsp-src.meta
      - 'echo "built vendor/gpsp_libretro.so from vendor/gpsp-src.tar.gz @ {{.GPSP_COMMIT}}"'

  core:fetch:
    desc: >-
      Fetch the aarch64 linux builds of the cores slot does not build itself from the libretro
      buildbot, and note where, when and at what hash each came in vendor/cores.manifest
    status:
      - test -f vendor/cores.manifest
      - for c in {{.FETCHED}}; do test -f "vendor/${c}_libretro.so" || exit 1; done
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        : > "$tmp/manifest"
        for c in {{.FETCHED}}; do
          url="https://buildbot.libretro.com/nightly/linux/aarch64/latest/${c}_libretro.so.zip"
          curl -fsSL -o "$tmp/$c.zip" "$url"
          unzip -o -q "$tmp/$c.zip" -d "$tmp"
          file "$tmp/${c}_libretro.so" | grep -q aarch64
          mv "$tmp/${c}_libretro.so" vendor/
          sum="$(sha256sum "vendor/${c}_libretro.so" | cut -d' ' -f1)"
          echo "$c $sum $(date -u +%Y-%m-%d) $url" >> "$tmp/manifest"
        done
        mv "$tmp/manifest" vendor/cores.manifest
        echo "fetched {{.FETCHED}}"

  services:
    desc: >-
      Build Tailscale and wireguard-go for the H700 from pinned sources and fetch Syncthing's
      release and spruceOS's prebuilt Samba (with libnsl from Ubuntu jammy), into vendor/services, noting where each came from in services.manifest.
      Needs a Linux host; Go is fetched and checked if a new enough one is not on PATH
    status:
      - test -f vendor/services/services.manifest
      - test -f vendor/services/samba/lib/vfs/streams_xattr.so
      - test -f vendor/services/samba/lib/vfs/xattr_tdb.so
    cmds:
      - sh tools/services/build.sh vendor/services

  drastic:
    desc: >-
      Fetch DraStic and its own BIOS from trngaje's advanced_drastic and build SDL_drastic with
      Knulli's H700 patches into vendor/drastic, for the DS, noting where each came from in
      drastic.manifest
    # dist:device wants it both directly and through ppsspp; two at once race on the download cache.
    run: once
    status:
      - test -f vendor/drastic/drastic.manifest
      - test -f vendor/drastic/libs/libunslot-drastic.so
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            DRASTIC_CACHE=target-device/drastic-cache sh tools/drastic/build.sh vendor/drastic
            && chown -R {{.UID}}:{{.GID}} vendor/drastic
      - file vendor/drastic/drastic | grep -q aarch64
      - file vendor/drastic/libs/libSDL2-2.0.so.0 | grep -q aarch64
      - file vendor/drastic/libs/libunslot-drastic.so | grep -q aarch64
    vars:
      UID: {sh: id -u}
      GID: {sh: id -g}

  glshim:
    desc: >-
      Build System/lib/libGL.so.1 for the handhelds, whose firmware has GLES 2 only: cores that
      name desktop GL in their headers are refused by the loader without it
    status:
      - test -f vendor/glshim/libGL.so.1
    cmds:
      - sh tools/glshim/build.sh vendor/glshim

  ppsspp:
    desc: >-
      Build standalone PPSSPPSDL and its unslot volume/hotkey shim into vendor/ppsspp for PSP,
      linking against H700 SDL_drastic and noting sources in ppsspp.manifest
    deps: [drastic]
    status:
      - test -f vendor/ppsspp/ppsspp.manifest
      - test -f vendor/ppsspp/PPSSPPSDL
      - test -f vendor/ppsspp/libs/libunslot-ppsspp.so
    cmds:
      - |
        set -eu
        run="DRASTIC_CACHE=target-device/drastic-cache sh tools/ppsspp/build.sh vendor/ppsspp"
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c "$run"
        else
          docker build -q -t unslot-gles cores/gles > /dev/null
          docker run --rm -v "$PWD":/src -w /src unslot-gles sh -c "$run; s=\$?; \
            chown -R $(id -u):$(id -g) target-device/ppsspp vendor/ppsspp; exit \$s"
        fi
      - file vendor/ppsspp/PPSSPPSDL | grep -q aarch64
      - file vendor/ppsspp/libs/libunslot-ppsspp.so | grep -q aarch64

  portmaster:
    desc: >-
      Fetch what PortMaster's ports run on into vendor/portmaster: PortMaster's runtime, tools
      and LÖVE from its pinned release, and Ubuntu 22.04's static bash, zip and the libraries
      BaseOS lacks, noting where each came from in portmaster.manifest
    status:
      - test -f vendor/portmaster/portmaster.manifest
    cmds:
      - sh tools/portmaster/fetch.sh vendor/portmaster

  core:fake08:
    desc: >-
      Build the aarch64 linux fake-08 core, which plays PICO-8 carts, from its pinned source
      archive and the pinned archive of its Lua (a git submodule GitHub's archives leave out)
    status:
      - test -f vendor/fake08_libretro.so
      - test "$(cat vendor/fake08_libretro.so.meta 2>/dev/null)" = "$(sh cores/fake08/build.sh stamp {{.FAKE08_COMMIT}} {{.Z8LUA_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/fake08_libretro.so vendor/fake08_libretro.so.meta vendor/fake08-src.tar.gz vendor/z8lua-src.tar.gz
        curl -fsSL -o vendor/fake08-src.tar.gz "https://github.com/jtothebell/fake-08/archive/{{.FAKE08_COMMIT}}.tar.gz"
        curl -fsSL -o vendor/z8lua-src.tar.gz "https://github.com/jtothebell/z8lua/archive/{{.Z8LUA_COMMIT}}.tar.gz"
        tar -tzf vendor/fake08-src.tar.gz | grep "^fake-08-{{.FAKE08_COMMIT}}/platform/libretro/Makefile$" > /dev/null
        tar -tzf vendor/z8lua-src.tar.gz | grep "^z8lua-{{.Z8LUA_COMMIT}}/eris.c$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/fake08/build.sh build {{.FAKE08_COMMIT}} {{.Z8LUA_COMMIT}}
            vendor/fake08-src.tar.gz vendor/z8lua-src.tar.gz
            target-device/fake08 vendor/fake08_libretro.so
            && chown {{.UID}}:{{.GID}} vendor/fake08_libretro.so vendor/fake08_libretro.so.meta
      - file vendor/fake08_libretro.so | grep -q aarch64
      - 'echo "built vendor/fake08_libretro.so @ {{.FAKE08_COMMIT}}"'
    vars:
      UID: {sh: id -u}
      GID: {sh: id -g}

  pico8:
    desc: >-
      Build libunslot-pico8.so and libunslot-pico8-64.so, the 32-bit and 64-bit ARM shims slot
      preloads into the owner's PICO-8, against BaseOS's glibc in Ubuntu 22.04 boxes, or with ARM
      compilers on this one
    status:
      - test -f vendor/pico8/libunslot-pico8.so
      - test vendor/pico8/libunslot-pico8.so -nt tools/pico8/sdl.c
      - test vendor/pico8/libunslot-pico8.so -nt tools/bridge/bridge.h
      - test -f vendor/pico8/libunslot-pico8-64.so
      - test vendor/pico8/libunslot-pico8-64.so -nt tools/pico8/sdl.c
      - test vendor/pico8/libunslot-pico8-64.so -nt tools/bridge/bridge.h
    cmds:
      - |
        set -eu
        if command -v arm-linux-gnueabihf-gcc >/dev/null 2>&1 || command -v zig >/dev/null 2>&1; then
          sh tools/pico8/build.sh vendor/pico8/libunslot-pico8.so
        else
          docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src ubuntu:22.04 sh -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev >/dev/null &&
            sh tools/pico8/build.sh vendor/pico8/libunslot-pico8.so && chown -R {{.UID}}:{{.GID}} vendor/pico8'
        fi
      - |
        set -eu
        if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 || command -v zig >/dev/null 2>&1; then
          sh tools/pico8/build.sh vendor/pico8/libunslot-pico8-64.so aarch64
        else
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:22.04 sh -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev >/dev/null &&
            sh tools/pico8/build.sh vendor/pico8/libunslot-pico8-64.so aarch64 && chown -R {{.UID}}:{{.GID}} vendor/pico8'
        fi
      - file vendor/pico8/libunslot-pico8.so | grep -q 'ARM, EABI5'
      - file vendor/pico8/libunslot-pico8-64.so | grep -q 'ARM aarch64'
    vars:
      UID: {sh: id -u}
      GID: {sh: id -g}

  core:fetch:update:
    desc: Re-fetch the buildbot cores even if every one is already in vendor/
    cmds:
      - rm -f vendor/cores.manifest
      - task: core:fetch

  core:nodosumi:
    desc: >-
      Fetch the H700 build from Nodosumi's latest GitHub release, unslot's own Dreamcast core, and
      note its tag and commit in vendor/nodosumi_libretro.so.meta; fetches again once there is a newer one
    vars:
      REPO: https://github.com/cloudwithax/nodosumi
      # The tag GitHub's latest release redirects to, looked up on every run.
      TAG:
        sh: >-
          curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/cloudwithax/nodosumi/releases/latest
          | sed 's|.*/tag/||'
    status:
      - grep -q "^tag={{.TAG}}$" vendor/nodosumi_libretro.so.meta
    cmds:
      - |
        set -eu
        tag='{{.TAG}}'
        case "$tag" in v*) ;; *) echo "no latest Nodosumi release: '$tag'" >&2; exit 1 ;; esac
        commit="$(git ls-remote {{.REPO}} "refs/tags/$tag^{}" | cut -f1)"
        [ -n "$commit" ] || commit="$(git ls-remote {{.REPO}} "refs/tags/$tag" | cut -f1)"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/nodosumi.zip" "{{.REPO}}/releases/download/$tag/nodosumi-${tag#v}-h700.zip"
        unzip -o -q "$tmp/nodosumi.zip" nodosumi_libretro.so -d "$tmp"
        file "$tmp/nodosumi_libretro.so" | grep -q aarch64
        mkdir -p vendor
        mv "$tmp/nodosumi_libretro.so" vendor/
        printf 'core=nodosumi\ntag=%s\ncommit=%s\nsource=%s/tree/%s\ngles=yes\n' \
          "$tag" "$commit" "{{.REPO}}" "$commit" > vendor/nodosumi_libretro.so.meta
        echo "fetched Nodosumi $tag ($commit)"

  media:
    desc: >-
      Build MuPDF's mutool for the H700 and fetch a static arm64 ffmpeg into vendor/media, for the
      Apps' PDF reader and video player
    status:
      - grep -q "^mupdf={{.MUPDF_VERSION}}$" vendor/media/media.meta
      - test -f vendor/media/mutool
      - test -f vendor/media/ffmpeg
    cmds:
      - mkdir -p vendor/media target-device
      - |
        set -eu
        src="target-device/mupdf-{{.MUPDF_VERSION}}-source"
        if [ ! -d "$src" ]; then
          curl -fsSL -o target-device/mupdf.tar.gz \
            "https://mupdf.com/downloads/archive/mupdf-{{.MUPDF_VERSION}}-source.tar.gz"
          tar -xzf target-device/mupdf.tar.gz -C target-device
          rm -f target-device/mupdf.tar.gz
        fi
      - task: device:sh
        vars:
          CMD: >-
            make -C target-device/mupdf-{{.MUPDF_VERSION}}-source -j"$(nproc)" build=release
            HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no HAVE_LIBCRYPTO=no tools
            && cp target-device/mupdf-{{.MUPDF_VERSION}}-source/build/release/mutool vendor/media/mutool
            && chown {{.UID}}:{{.GID}} vendor/media/mutool
      - file vendor/media/mutool | grep -q aarch64
      - |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/ffmpeg.tar.xz" "{{.FFMPEG_URL}}"
        tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
        dir="$(ls -d "$tmp"/ffmpeg-*-static | head -n 1)"
        file "$dir/ffmpeg" | grep -q aarch64
        cp "$dir/ffmpeg" vendor/media/ffmpeg
        cp "$dir/GPLv3.txt" vendor/media/ffmpeg-GPLv3.txt
        ffmpeg_version="$(basename "$dir" | sed 's/^ffmpeg-//; s/-arm64-static$//')"
        printf 'mupdf={{.MUPDF_VERSION}}\nmupdf_source=https://mupdf.com/downloads/archive/mupdf-{{.MUPDF_VERSION}}-source.tar.gz\nffmpeg=%s\nffmpeg_source={{.FFMPEG_URL}}\n' \
          "$ffmpeg_version" > vendor/media/media.meta
        echo "vendored mutool {{.MUPDF_VERSION}} and ffmpeg $ffmpeg_version"
    vars:
      UID: {sh: id -u}
      GID: {sh: id -g}

  overlays:
    desc: >-
      Fetch R. Savant's H700 overlays at OVERLAYS_COMMIT and lay them out as slot's bezels in
      vendor/overlays, a folder per screen size and per system
    status:
      - grep -q "^commit={{.OVERLAYS_COMMIT}}$" vendor/overlays/overlays.meta
    cmds:
      - |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        rm -rf vendor/overlays
        mkdir -p vendor/overlays
        # The pack's name for a system, slot's folder for it, and the bezel's name in the menu.
        map='gb:GB:Game Boy
        gbc:GBC:Game Boy Color
        gba:GBA:Game Boy Advance
        gamegear:GG:Game Gear
        genesis:MD:Genesis
        megadrive:MD:Mega Drive
        lynx:LYNX:Lynx
        mastersystem:SMS:Master System
        neogeo:NEOGEO:Neo Geo
        neogeocd:NEOCD:Neo Geo CD
        nes:NES:NES
        ngpc:NGP:Neo Geo Pocket Color
        pcengine:PCE:PC Engine
        tg16:PCE:TurboGrafx-16
        pcenginecd:PCECD:PC Engine CD
        tg16cd:PCECD:TurboGrafx-CD
        psx:PS:PlayStation
        sega32x:32X:32X
        segacd:SEGACD:Sega CD
        snes:SNES:Super Nintendo
        supergrafx:SGFX:SuperGrafx
        wswan:WS:WonderSwan
        wswanc:WS:WonderSwan Color'
        for res in 640x480:4_3 720x480:3_2 720x720:1_1; do
          size="${res%%:*}" aspect="${res#*:}"
          curl -fsSL -o "$tmp/$size.zip" \
            "https://github.com/RighteousSavant/Anbernic-H700-Overlays/raw/{{.OVERLAYS_COMMIT}}/KNULLI%20Overlays/R.%20Savant%27s%20${size}%20KNULLI%20Overlays.zip"
          unzip -o -q "$tmp/$size.zip" -d "$tmp/$size"
          src="$tmp/$size/righteous-savant-overlays/systems"
          echo "$map" | while IFS=: read -r name dir label; do
            png="$src/$name-$aspect.png"
            # One of the 640x480 pictures is named as if it were its .info.
            [ -f "$png" ] || png="$src/$name-$aspect.info.png"
            [ -f "$png" ] || continue
            mkdir -p "vendor/overlays/$size/$dir"
            cp "$png" "vendor/overlays/$size/$dir/$label.png"
            cp "$src/$name-$aspect.info" "vendor/overlays/$size/$dir/$label.info"
          done
        done
        printf 'overlays=R. Savant'"'"'s H700 overlays\ncommit={{.OVERLAYS_COMMIT}}\nsource=https://github.com/RighteousSavant/Anbernic-H700-Overlays/tree/{{.OVERLAYS_COMMIT}}\n' \
          > vendor/overlays/overlays.meta
        echo "vendored $(ls vendor/overlays/*/*/*.png | wc -l) overlays"

  core:gles:
    desc: >-
      Build the GPU cores (ParaLLEl N64, Flycast) and vecx against OpenGL ES from their
      pinned commits, natively on an aarch64 Linux box or cross-compiled in cores/gles/Dockerfile
    status:
      - |
        for spec in {{.GLES_CORES}}; do
          c="${spec%%:*}" commit="${spec#*:}"
          grep -q "^commit=$commit$" "vendor/${c}_libretro.so.meta" 2>/dev/null || exit 1
        done
    cmds:
      - |
        set -eu
        native=0
        [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ] && native=1
        [ "$native" = 1 ] || docker build -q -t unslot-gles cores/gles > /dev/null
        for spec in {{.GLES_CORES}}; do
          c="${spec%%:*}" commit="${spec#*:}"
          run="sh cores/gles/build.sh $c $commit target-device/gles/$c vendor/${c}_libretro.so"
          if [ "$native" = 1 ]; then
            sh -c "$run"
          else
            docker run --rm -v "$PWD":/src -w /src unslot-gles sh -c "$run"
          fi
          file "vendor/${c}_libretro.so" | grep -q aarch64
        done

  cast:lib:
    desc: >-
      Build libslotcast.so, x264, Opus, mbedTLS and FAAC from their pinned commits, natively on an
      aarch64 Linux box or cross-compiled in cores/gles/Dockerfile
    status:
      - |
        set -- {{.SLOTCAST}}
        m=vendor/libslotcast.so.meta
        grep -qx "x264=$1" $m && grep -qx "opus=$2" $m && grep -qx "mbedtls=$3" $m \
          && grep -qx "faac=$4" $m
    cmds:
      - |
        set -eu
        run="sh slotcast/build.sh {{.SLOTCAST}} target-device/slotcast vendor/libslotcast.so"
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c "$run"
        else
          docker build -q -t unslot-gles cores/gles > /dev/null
          # Docker runs this as root; the files go back to whoever builds them.
          docker run --rm -v "$PWD":/src -w /src unslot-gles sh -c "$run; s=\$?; \
            chown -R $(id -u):$(id -g) target-device/slotcast vendor; exit \$s"
        fi
        file vendor/libslotcast.so | grep -q aarch64

  core:gpsp:update:
    desc: Refetch gpSP's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz
        vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp

  core:gpsp:test:
    desc: Prove gpSP's Advance Wars session-flip patch still fixes what it was written for
    deps: [core:gpsp]
    cmds:
      - sh cores/gpsp/test/run.sh vendor/gpsp-src.tar.gz

  device:sh:
    desc: Run CMD on the box the device build wants, fetching one if this is not it
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - |
        set -eu
        # unslot's ScreenScraper developer id is read at compile time, so it has to reach the
        # container the build runs in; on an aarch64 machine the job's own environment has it,
        # as it does in CI.
        keys=""
        for k in UNSLOT_SS_DEVID UNSLOT_SS_DEVPASSWORD; do
          eval "v=\${$k:-}"
          if [ -n "$v" ]; then keys="$keys -e $k"; fi
        done
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm --platform linux/arm64 $keys -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}'
        fi

  build:device:
    desc: Build for the H700, in an arm64 container unless this is already one
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot --no-default-features --features device
      - tools/target-cap/target-cap.sh
      - file target-device/device/slot | grep -q aarch64
      - 'echo "built target-device/device/slot"'

  bench:device:
    desc: Build core_bench, slot-retro's headless core benchmark, for the H700. It never ships
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot-retro --example core_bench
      - file target-device/device/examples/core_bench | grep -q aarch64
      - 'echo "built target-device/device/examples/core_bench, adb push it to /tmp/core_bench"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    deps: [core:device, core:gpsp, core:fetch, core:gles, core:nodosumi, core:fake08, pico8, cast:lib, services, media, overlays, drastic, ppsspp, portmaster, glshim, build:device]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
      UID: {sh: id -u}
      GID: {sh: id -g}
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          # Docker on an x86 host runs this as root; the tree goes back to whoever builds it.
          CMD: ./target-device/device/slot --init-root {{.OUT}} && chown -R {{.UID}}:{{.GID}} {{.OUT}}
      - cp target-device/device/slot {{.OUT}}/System/slot
      - cp -R card/System/* {{.OUT}}/System/
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - cp vendor/mgba_libretro.so {{.OUT}}/System/
      - cp vendor/gpsp_libretro.so {{.OUT}}/System/
      - for c in {{.FETCHED}}; do cp "vendor/${c}_libretro.so" {{.OUT}}/System/; done
      - for spec in {{.GLES_CORES}}; do cp "vendor/${spec%%:*}_libretro.so" {{.OUT}}/System/; done
      - cp vendor/libslotcast.so {{.OUT}}/System/
      - mkdir -p {{.OUT}}/System/lib && cp vendor/glshim/libGL.so.1 {{.OUT}}/System/lib/
      - cp -r licenses {{.OUT}}/System/licenses
      - cp vendor/libslotcast.so.meta {{.OUT}}/System/licenses/libslotcast.meta
      - |
        set -eu
        # Where each source-built core came from, for its licence's source offer.
        for spec in {{.GLES_CORES}}; do
          c="${spec%%:*}"
          cp "vendor/${c}_libretro.so.meta" "{{.OUT}}/System/licenses/${c}-${spec#*:}.meta"
        done
        cp vendor/nodosumi_libretro.so "{{.OUT}}/System/"
        commit="$(grep '^commit=' vendor/nodosumi_libretro.so.meta | cut -d= -f2)"
        cp vendor/nodosumi_libretro.so.meta "{{.OUT}}/System/licenses/nodosumi-$commit.meta"
        file vendor/fake08_libretro.so | grep -q aarch64
        cp vendor/fake08_libretro.so "{{.OUT}}/System/"
        cp vendor/fake08_libretro.so.meta "{{.OUT}}/System/licenses/fake-08-{{.FAKE08_COMMIT}}.meta"
        for p in cores/fake08/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/fake-08-$(basename "$p")"
        done
      - cp vendor/cores.manifest {{.OUT}}/System/licenses/cores.manifest
      - |
        set -eu
        # The Apps' PDF reader and video player; MuPDF is AGPL and ffmpeg GPL, with their sources
        # noted in media.meta.
        mkdir -p "{{.OUT}}/System/bin"
        cp vendor/media/mutool vendor/media/ffmpeg "{{.OUT}}/System/bin/"
        cp vendor/media/media.meta vendor/media/ffmpeg-GPLv3.txt "{{.OUT}}/System/licenses/"
      - cp -R vendor/services {{.OUT}}/System/services
      - |
        set -eu
        # DraStic, Exophase's freeware, beside the launcher and settings card/System/drastic gave
        # it, and the SDL it runs on, zlib's; with where each came from.
        mkdir -p "{{.OUT}}/System/drastic"
        cp -R vendor/drastic/drastic vendor/drastic/libs vendor/drastic/system vendor/drastic/game_database.xml "{{.OUT}}/System/drastic/"
        cp vendor/drastic/drastic.manifest vendor/drastic/drastic_readme.txt vendor/drastic/SDL-LICENSE.txt "{{.OUT}}/System/licenses/"
      # The shims the owner's PICO-8 runs with, beside card/System/pico8's launcher.
      - cp vendor/pico8/libunslot-pico8.so vendor/pico8/libunslot-pico8-64.so {{.OUT}}/System/pico8/
      - |
        set -eu
        # Standalone PPSSPP-SDL beside card/System/ppsspp's launcher and tuned configs, with its
        # GPL licence and where it came from.
        mkdir -p "{{.OUT}}/System/ppsspp"
        cp -R vendor/ppsspp/PPSSPPSDL vendor/ppsspp/assets vendor/ppsspp/libs "{{.OUT}}/System/ppsspp/"
        cp vendor/ppsspp/ppsspp.manifest "{{.OUT}}/System/licenses/"
        cp vendor/ppsspp/LICENSE.TXT "{{.OUT}}/System/licenses/ppsspp-LICENSE.txt"
      - |
        set -eu
        # PortMaster's runtime and tools beside the control.txt and harbourmaster
        # card/System/PortMaster gave it, for ports from PortMaster, with the H700 SDL DraStic runs
        # on, which they run on too, and the libraries BaseOS lacks; bash and zip for their
        # scripts; and where each came from.
        cp -R vendor/portmaster/PortMaster/. "{{.OUT}}/System/PortMaster/"
        mkdir -p "{{.OUT}}/System/PortMaster/libs.aarch64"
        cp vendor/drastic/libs/libSDL2-2.0.so.0 "{{.OUT}}/System/PortMaster/libs.aarch64/"
        cp vendor/portmaster/bin/bash vendor/portmaster/bin/zip "{{.OUT}}/System/bin/"
        cp vendor/portmaster/licenses/* vendor/portmaster/portmaster.manifest "{{.OUT}}/System/licenses/"
      - |
        set -eu
        # R. Savant's overlays, free for any H700 handheld, with where they came from.
        mkdir -p "{{.OUT}}/System/overlays"
        cp -R vendor/overlays/*x* "{{.OUT}}/System/overlays/"
        cp vendor/overlays/overlays.meta "{{.OUT}}/System/licenses/overlays.meta"
      - |
        set -eu
        # The wallpapers and extra slot sets a build ships. A fork can ship its own, or none:
        # an empty or missing folder is fine.
        mkdir -p "{{.OUT}}/System/Wallpapers" "{{.OUT}}/System/Slots"
        for f in assets/wallpapers/*; do
          case "$f" in *.[jJ][pP][gG] | *.[jJ][pP][eE][gG] | *.[pP][nN][gG]) cp "$f" "{{.OUT}}/System/Wallpapers/" ;; esac
        done
        # assets/slots/sp holds the SP colours, which are built into slot; any other folder there
        # is a set of its own.
        for d in assets/slots/*/; do
          if [ -d "$d" ] && [ "$(basename "$d")" != sp ]; then cp -R "$d" "{{.OUT}}/System/Slots/"; fi
        done
        true
      - |
        set -eu
        # The release this tree is, which the updater compares with the latest.
        v='{{.VERSION | default ""}}'
        [ -n "$v" ] || v="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
        echo "$v" > "{{.OUT}}/System/version"
      - mv {{.OUT}}/System/services/services.manifest {{.OUT}}/System/licenses/services.manifest
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  image:device:
    desc: >-
      Build a card image to flash to TF1: BaseOS for TARGET (default rg34xxsp) with unslot already
      on its BASEOS partition, into OUT (default unslot-TARGET.img.zip). Needs a Linux host
    vars:
      TARGET: '{{.TARGET | default "rg34xxsp"}}'
      OUT: '{{.OUT | default (print "unslot-" .TARGET ".img.zip")}}'
    cmds:
      - task: dist:device
        vars:
          OUT: dist-device
          VERSION: '{{.VERSION | default ""}}'
      - sh tools/image/build.sh {{.TARGET}} dist-device {{.OUT}}

  dist:update:
    desc: >-
      Build the update from a fresh device tree: PACK (default ./MinUI.zip), which BaseOS installs
      at the root of a card running slot, and unslot-<version>.pak, the same zip signed with the
      release key in UNSLOT_PAK_KEY, which is what unslot itself installs
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
      PACK: '{{.PACK | default "MinUI.zip"}}'
    cmds:
      - task: dist:device
        vars:
          OUT: '{{.OUT}}'
          VERSION: '{{.VERSION | default ""}}'
      - sh tools/update/pack.sh {{.OUT}} {{.PACK}}
      - task: dist:pak
        vars:
          OUT: '{{.OUT}}'
          PACK: '{{.PACK}}'

  dist:pak:
    desc: >-
      Sign the update zip PACK as unslot-<version>.pak, the version from the tree OUT, with the
      release key: UNSLOT_PAK_KEY, the key's 32-byte seed in hex
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
      PACK: '{{.PACK | default "MinUI.zip"}}'
    requires:
      vars: [UNSLOT_PAK_KEY]
    env:
      UNSLOT_PAK_KEY: '{{.UNSLOT_PAK_KEY}}'
    cmds:
      - |
        set -eu
        v="$(cat "{{.OUT}}/System/version")"
        cargo run -q --release -p slot --no-default-features --example make_pak --           "{{.PACK}}" "$v" "unslot-$v.pak"

  build:a133p:
    desc: >-
      Build for TrimUI's A133P handhelds, the Smart Pro, Brick and Brick Pro, against the glibc
      2.23 SDK baseline through zig: cargo install cargo-zigbuild, and pip install ziglang
      or put zig on the PATH
    cmds:
      - >-
        UNSLOT_CHIP=a133p CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=cortex-a53"
        cargo zigbuild --profile device --target aarch64-unknown-linux-gnu.2.23
        --target-dir target-a133p -p slot --no-default-features --features device
      - tools/target-cap/target-cap.sh
      - sh tools/a133p/check-glibc.sh target-a133p/aarch64-unknown-linux-gnu/device/slot
      - 'echo "built target-a133p/aarch64-unknown-linux-gnu/device/slot"'

  core:a133p:
    desc: Build the mGBA core for the A133P handhelds, against their firmware's glibc, through zig
    status:
      - test -f target-a133p/cores/mgba_libretro.so
      - test "$(cat target-a133p/cores/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - >-
        CMAKE_TOOLCHAIN_FILE="$PWD/tools/a133p/toolchain.cmake" sh cores/mgba/build.sh build
        {{.MGBA_COMMIT}} target-a133p/mgba target-a133p/cores/mgba_libretro.so
      - sh tools/a133p/check-glibc.sh target-a133p/cores/mgba_libretro.so

  core:a133p:extra:
    desc: Rebuild shipped cores from pinned sources for A133P (optional CORE arguments)
    cmds:
      - sh tools/a133p/cores.sh {{.CLI_ARGS}}

  drastic:a133p:
    desc: Host-build PowerVR SDL2 and stage DraStic (closed runner requires glibc 2.27)
    cmds:
      - sh tools/a133p/drastic.sh

  ppsspp:a133p:
    desc: >-
      Build standalone PPSSPPSDL for the A133P handhelds through zig, against the PowerVR SDL2
      DraStic uses, with the patch that resolves GLES 3 entry points PowerVR's EGL will not
    status:
      - test -f target-a133p/ppsspp/ppsspp.meta
      - test -f target-a133p/ppsspp/PPSSPPSDL
      - test -f target-a133p/ppsspp/libs/libunslot-ppsspp.so
    cmds:
      - sh tools/a133p/ppsspp.sh target-a133p/ppsspp
      - file target-a133p/ppsspp/PPSSPPSDL | grep -q aarch64
      - file target-a133p/ppsspp/libs/libunslot-ppsspp.so | grep -q aarch64
      - >-
        sh tools/a133p/check-glibc.sh target-a133p/ppsspp/PPSSPPSDL
        target-a133p/ppsspp/libs/libSDL2-2.0.so.0 target-a133p/ppsspp/libs/libunslot-ppsspp.so

  dist:a133p:
    desc: >-
      Build the card for TrimUI's A133P handhelds into OUT (default dist-a133p): the H700 tree
      FROM (default dist-device, from task dist:device or an unzipped unslot-<version>-h700.zip)
      with the A133P's own slot and mGBA, this checkout's card/System, and the files TrimUI's
      firmware boots it through. Copy all of OUT, .tmp_update too, to the root of the card
    deps: [build:a133p, core:a133p, ppsspp:a133p]
    vars:
      OUT: '{{.OUT | default "dist-a133p"}}'
      FROM: '{{.FROM | default "dist-device"}}'
    cmds:
      - test -f "{{.FROM}}/System/slot" || { echo "{{.FROM}} is not a device tree" >&2; exit 1; }
      - rm -rf {{.OUT}}
      - cp -R {{.FROM}} {{.OUT}}
      - cp target-a133p/aarch64-unknown-linux-gnu/device/slot {{.OUT}}/System/slot
      - |
        set -eu
        mkdir -p "{{.OUT}}/System/licenses"
        manifest="{{.OUT}}/System/licenses/cores.manifest"
        for f in target-a133p/cores/*_libretro.so; do
          test -f "$f" || continue
          sh tools/a133p/check-glibc.sh "$f"
          cp "$f" "{{.OUT}}/System/"
          # Debug symbols stay in target-a133p; ScummVM alone is 757 MB unstripped.
          ${STRIP:-aarch64-linux-gnu-strip} --strip-unneeded "{{.OUT}}/System/$(basename "$f")"
          cp "$f.meta" "{{.OUT}}/System/licenses/$(basename "$f").meta"
          c="$(basename "$f" _libretro.so)"
          rm -f "{{.OUT}}/System/licenses/$c"-*.meta
          if test -f "$manifest"; then
            awk -v core="$c" '$1 != core' "$manifest" > "$manifest.new"
            mv "$manifest.new" "$manifest"
          fi
        done
        if test -f "$manifest" && ! test -s "$manifest"; then rm "$manifest"; fi
      - cp -R card/System/. {{.OUT}}/System/
      - cp -R ports/a133p/card/. {{.OUT}}/
      - sh tools/a133p/portmaster.sh {{.OUT}}
      # The H700's PPSSPP hangs on the A133P's GPU and its launcher and configs would stand in the
      # way of the A133P one, which links its own PowerVR SDL2; a legacy uppercase PPSSPP folder,
      # which vfat's short names make unreachable as System/ppsspp, goes too.
      - rm -rf {{.OUT}}/System/ppsspp {{.OUT}}/System/PPSSPP {{.OUT}}/System/licenses/ppsspp.manifest {{.OUT}}/System/licenses/ppsspp-LICENSE.txt
      - |
        set -eu
        # Standalone PPSSPP-SDL built for the PowerVR, beside card/System/ppsspp's launcher and
        # tuned configs, with its GPL and SDL licences and where it came from.
        if test -f target-a133p/ppsspp/ppsspp.meta; then
          mkdir -p "{{.OUT}}/System/ppsspp" "{{.OUT}}/System/licenses"
          cp -R target-a133p/ppsspp/PPSSPPSDL target-a133p/ppsspp/assets target-a133p/ppsspp/libs "{{.OUT}}/System/ppsspp/"
          cp card/System/ppsspp/launch.sh card/System/ppsspp/ppsspp.ini card/System/ppsspp/controls.ini "{{.OUT}}/System/ppsspp/"
          cp target-a133p/ppsspp/ppsspp.meta "{{.OUT}}/System/licenses/"
          cp target-a133p/ppsspp/LICENSE.TXT "{{.OUT}}/System/licenses/ppsspp-LICENSE.txt"
          cp target-a133p/ppsspp/SDL-LICENSE.txt "{{.OUT}}/System/licenses/"
        fi
      - |
        set -eu
        if test -f target-a133p/drastic/drastic.meta; then
          mkdir -p "{{.OUT}}/System/drastic" "{{.OUT}}/System/licenses"
          for f in drastic libs system game_database.xml drastic.cfg; do
            cp -R "target-a133p/drastic/$f" "{{.OUT}}/System/drastic/"
          done
          for f in drastic.meta drastic_readme.txt SDL-LICENSE.txt; do
            cp "target-a133p/drastic/$f" "{{.OUT}}/System/licenses/"
          done
          rm -f "{{.OUT}}/System/licenses/drastic.manifest"
        fi
      - |
        set -eu
        v='{{.VERSION | default ""}}'
        [ -n "$v" ] || v="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
        echo "$v" > "{{.OUT}}/System/version"
      - |
        # What in the tree the firmware's glibc is too old for, so a core that will not load is
        # no surprise.
        mkdir -p {{.OUT}}/Logs
        sh tools/a133p/check-glibc.sh -r {{.OUT}}/System > {{.OUT}}/Logs/a133p-glibc.txt
        echo "$(wc -l < {{.OUT}}/Logs/a133p-glibc.txt) files need a newer glibc; see {{.OUT}}/Logs/a133p-glibc.txt"
      - 'echo "A133P card ready at {{.OUT}}, copy all of it, .tmp_update too, to the card root"'

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    deps: [core:device, core:gpsp, core:fetch, services, overlays, drastic, ppsspp, portmaster, glshim, build:device]
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - adb push target-device/device/slot '{{.SD}}/System/slot'
      - for f in card/System/*; do adb push "$f" '{{.SD}}/System/'; done
      - adb push vendor/mgba_libretro.so '{{.SD}}/System/mgba_libretro.so'
      - adb push vendor/gpsp_libretro.so '{{.SD}}/System/gpsp_libretro.so'
      - for c in {{.FETCHED}}; do adb push "vendor/${c}_libretro.so" '{{.SD}}/System/'; done
      - adb push licenses '{{.SD}}/System/'
      - adb shell 'mkdir -p {{.SD}}/System/lib'
      - adb push vendor/glshim/libGL.so.1 '{{.SD}}/System/lib/'
      - adb push vendor/services '{{.SD}}/System/'
      - for f in drastic libs system game_database.xml; do adb push "vendor/drastic/$f" '{{.SD}}/System/drastic/'; done
      - for f in PPSSPPSDL assets libs; do adb push "vendor/ppsspp/$f" '{{.SD}}/System/ppsspp/'; done
      - adb push vendor/ppsspp/ppsspp.manifest '{{.SD}}/System/licenses/'
      - adb push vendor/ppsspp/LICENSE.TXT '{{.SD}}/System/licenses/ppsspp-LICENSE.txt'
      - adb push vendor/portmaster/PortMaster/. '{{.SD}}/System/PortMaster/'
      - adb shell 'mkdir -p {{.SD}}/System/PortMaster/libs.aarch64 {{.SD}}/System/bin'
      - adb push vendor/drastic/libs/libSDL2-2.0.so.0 '{{.SD}}/System/PortMaster/libs.aarch64/'
      - adb push vendor/portmaster/bin/bash vendor/portmaster/bin/zip '{{.SD}}/System/bin/'
      - adb shell 'mkdir -p {{.SD}}/System/overlays {{.SD}}/System/Wallpapers {{.SD}}/System/Slots'
      - for d in vendor/overlays/*x*; do adb push "$d" '{{.SD}}/System/overlays/'; done
      - adb push vendor/overlays/overlays.meta '{{.SD}}/System/licenses/overlays.meta'
      - |
        for f in assets/wallpapers/*; do
          case "$f" in *.[jJ][pP][gG] | *.[jJ][pP][eE][gG] | *.[pP][nN][gG]) adb push "$f" '{{.SD}}/System/Wallpapers/' ;; esac
        done
        for d in assets/slots/*/; do
          if [ -d "$d" ] && [ "$(basename "$d")" != sp ]; then adb push "$d" '{{.SD}}/System/Slots/'; fi
        done
        true
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        adb push vendor/gpsp-src.tar.gz "{{.SD}}/System/licenses/gpsp-${sha}.tar.gz"
        adb push vendor/gpsp-src.meta "{{.SD}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        adb push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - adb shell 'chmod +x {{.SD}}/System/slot && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/Logs/slot.log'

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist dist-device target-device
