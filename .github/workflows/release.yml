name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      pak: ${{ steps.package.outputs.pak }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, the GLES headers and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip python3-pip             libgles-dev libegl-dev zlib1g-dev libpng-dev pkg-config
          # Flycast wants a newer CMake than bullseye's.
          pip3 install --no-cache-dir 'cmake>=3.27,<3.31'
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        env:
          # unslot's ScreenScraper developer id, built in when the repository has these secrets.
          UNSLOT_SS_DEVID: ${{ secrets.UNSLOT_SS_DEVID }}
          UNSLOT_SS_DEVPASSWORD: ${{ secrets.UNSLOT_SS_DEVPASSWORD }}
        run: task dist:device OUT="unslot-${GITHUB_REF_NAME}" VERSION="${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          test "$(cat "$out/System/version")" = "$GITHUB_REF_NAME"
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          for so in "$out"/System/*_libretro.so; do
            file "$so" | grep -q aarch64
          done
          test "$(ls "$out"/System/*_libretro.so | wc -l)" -ge 47
          # The GPU cores are built for GLES; one linking desktop GL would not load on BaseOS.
          for c in parallel_n64 flycast ppsspp vecx; do
            ! readelf -d "$out/System/${c}_libretro.so" | grep -q 'libGL\.so\|libOpenGL\|libGLX'
          done
          test -f "$out/System/PPSSPP/ppge_atlas.zim"
          test -s "$out/System/licenses/cores.manifest"
          for b in tailscaled wireguard-go samba/bin/smbd samba/bin/smbpasswd; do
            file "$out/System/services/$b" | grep -q aarch64
          done
          test -s "$out/System/licenses/services.manifest"
          ls "$out"/System/Wallpapers/*.jpg > /dev/null
          test -s "$out/System/licenses/wallpapers.txt"
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        env:
          # The release key's secret half, which signs the .pak unslot installs.
          UNSLOT_PAK_KEY: ${{ secrets.UNSLOT_PAK_KEY }}
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          # The same System folder as an update pack, which BaseOS installs from a card's root.
          sh tools/update/pack.sh "$out" MinUI.zip
          # And signed, as unslot-<version>.pak, which is what unslot installs.
          test -n "$UNSLOT_PAK_KEY" || { echo "UNSLOT_PAK_KEY is not set" >&2; exit 1; }
          task dist:pak OUT="$out" PACK=MinUI.zip
          pak="unslot-${GITHUB_REF_NAME}.pak"
          test -f "$pak"
          sha256sum "$zip" "$pak" MinUI.zip > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "pak=$pak" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.pak }}
            MinUI.zip
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          PAK: ${{ needs.build.outputs.pak }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          **New card:** flash \`unslot-${GITHUB_REF_NAME}-<model>.img.zip\` to TF1 with any card flasher; it is BaseOS with unslot already on it, and its images follow a few minutes after the release. Or flash BaseOS yourself and copy the contents of \`unslot-${GITHUB_REF_NAME}/\` to its \`BASEOS\` volume, or to a card in TF2.

          **Already running unslot?** Settings, Network, Updates downloads \`$PAK\` and installs it when you restart. Or copy \`$PAK\` to the root of the card and restart with the power connected. unslot installs it only if it is a signed unslot release, and replaces \`System/\`, keeping your games, saves and settings.

          **Running slot?** Copy \`MinUI.zip\` to the root of the card and restart with the power connected. BaseOS installs it before the frontend starts.

          unslot is a fork of [slot](https://github.com/BrandonKowalski/slot) by Brandon T. Kowalski. Emulation by mGBA (MPL-2.0), gpSP (GPL-2.0) and libretro cores; every licence, and gpSP's source, is in \`System/licenses/\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$PAK" MinUI.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  images:
    name: card images
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ github.ref_name }}
