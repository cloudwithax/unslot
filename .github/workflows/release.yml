name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      pak: ${{ steps.package.outputs.pak }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, the GLES headers and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip zstd python3-pip             libgles-dev libegl-dev zlib1g-dev libpng-dev pkg-config
          # Flycast wants a newer CMake than bullseye's.
          pip3 install --no-cache-dir 'cmake>=3.27,<3.31'
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        env:
          # unslot's ScreenScraper developer id, built in when the repository has these secrets.
          UNSLOT_SS_DEVID: ${{ secrets.UNSLOT_SS_DEVID }}
          UNSLOT_SS_DEVPASSWORD: ${{ secrets.UNSLOT_SS_DEVPASSWORD }}
        run: task dist:device OUT="unslot-${GITHUB_REF_NAME}" VERSION="${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          test "$(cat "$out/System/version")" = "$GITHUB_REF_NAME"
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          for so in "$out"/System/*_libretro.so; do
            file "$so" | grep -q aarch64
          done
          test "$(ls "$out"/System/*_libretro.so | wc -l)" -ge 47
          # The GPU cores are built for GLES; one linking desktop GL would not load on BaseOS.
          for c in parallel_n64 nodosumi flycast vecx; do
            ! readelf -d "$out/System/${c}_libretro.so" | grep -q 'libGL\.so\|libOpenGL\|libGLX'
          done
          # The firmware has no desktop GL, so Beetle VB, which names it, loads on the card's shim.
          file "$out/System/lib/libGL.so.1" | grep -q aarch64
          # PSP runs in standalone PPSSPP-SDL, beside its launcher and its own SDL.
          for f in PPSSPPSDL libs/libunslot-ppsspp.so; do
            file "$out/System/ppsspp/$f" | grep -q aarch64
          done
          test -f "$out/System/ppsspp/launch.sh"
          test -f "$out/System/ppsspp/assets/ppge_atlas.zim"
          test -s "$out/System/licenses/ppsspp.manifest"
          file "$out/System/libslotcast.so" | grep -q aarch64
          test -s "$out/System/licenses/libslotcast.meta"
          test -s "$out/System/licenses/cores.manifest"
          for b in tailscaled wireguard-go syncthing samba/bin/smbd samba/bin/smbpasswd; do
            file "$out/System/services/$b" | grep -q aarch64
          done
          test -f "$out/System/services/samba/lib/libnsl.so.1"
          test -s "$out/System/licenses/services.manifest"
          # A fork may ship other wallpapers or none; what it ships must be credited.
          if [ -n "$(ls -A assets/wallpapers 2>/dev/null)" ]; then
            test -n "$(ls -A "$out/System/Wallpapers")"
            test -s "$out/System/licenses/wallpapers.txt"
          fi
          test -x "$out/System/slot"
          test -d "$out/Shaders"
          for b in mutool ffmpeg; do
            test -x "$out/System/bin/$b"
            file "$out/System/bin/$b" | grep -q aarch64
          done
          test -s "$out/System/licenses/media.meta"
          test -s "$out/System/licenses/mupdf-AGPL-3.0.txt"
          test -s "$out/System/licenses/ffmpeg-GPLv3.txt"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done
          # The DS: DraStic, its SDL and slot's volume hook beside the launcher, with their notes.
          for f in drastic libs/libSDL2-2.0.so.0 libs/libunslot-drastic.so; do
            file "$out/System/drastic/$f" | grep -q aarch64
          done
          test -f "$out/System/drastic/launch.sh"
          test -f "$out/System/drastic/drastic.cfg"
          test -s "$out/System/drastic/game_database.xml"
          for f in drastic.manifest drastic_readme.txt SDL-LICENSE.txt; do
            test -s "$out/System/licenses/$f"
          done
          # PortMaster's ports: unslot's control.txt and harbourmaster beside PortMaster's
          # runtime, tools and LÖVE, the H700 SDL they run on and the libraries BaseOS lacks, and
          # bash and zip for their scripts, with where each came from.
          for f in control.txt device_info.txt funcs.txt PortMasterDialog.txt gamecontrollerdb.txt version \
            harbourmaster utils/patcher.txt runtimes/love_11.5/love.txt; do
            test -s "$out/System/PortMaster/$f"
          done
          for f in gptokeyb gptokeyb2 libinterpose.aarch64.so portmsg.aarch64 7zzs.aarch64 xdelta3 \
            runtimes/love_11.5/love.aarch64 libs.aarch64/libSDL2-2.0.so.0 libs.aarch64/libopenal.so.1 \
            libs.aarch64/libvorbisfile.so.3 libs.aarch64/libmpg123.so.0; do
            file "$out/System/PortMaster/$f" | grep -q aarch64
          done
          file "$out/System/bin/bash" | grep -q 'aarch64.*statically linked'
          file "$out/System/bin/zip" | grep -q aarch64
          for f in portmaster.manifest portmaster-MIT.txt portmaster-gptokeyb-LICENSE.txt portmaster-gptokeyb2-LICENSE.txt \
            portmaster-love-LICENSE.txt libopenal1-copyright.txt bash-copyright.txt zip-copyright.txt \
            ca-certificates-copyright.txt; do
            test -s "$out/System/licenses/$f"
          done
          test -s "$out/System/ssl/ca-certificates.crt"

      - name: Package
        id: package
        env:
          # The release key's secret half, which signs the .pak unslot installs.
          UNSLOT_PAK_KEY: ${{ secrets.UNSLOT_PAK_KEY }}
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          # The same System folder as an update pack, which BaseOS installs from a card's root.
          sh tools/update/pack.sh "$out" MinUI.zip
          # And signed, as unslot-<version>.pak, which is what unslot installs.
          test -n "$UNSLOT_PAK_KEY" || { echo "UNSLOT_PAK_KEY is not set" >&2; exit 1; }
          task dist:pak OUT="$out" PACK=MinUI.zip
          pak="unslot-${GITHUB_REF_NAME}.pak"
          test -f "$pak"
          sha256sum "$zip" "$pak" MinUI.zip > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "pak=$pak" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.pak }}
            MinUI.zip
            SHA256SUMS
          if-no-files-found: error

  a133p:
    name: TrimUI A133P card
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      pak: ${{ steps.package.outputs.pak }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: h700

      - name: Install zig, cargo-zigbuild and Task
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip cmake binutils-aarch64-linux-gnu \
            python3-pip libasound2-dev libudev-dev
          pip3 install --break-system-packages ziglang==0.17.1
          curl -fsSL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
          rustup target add aarch64-unknown-linux-gnu
          cargo install --locked cargo-zigbuild@0.24.1

      # The A133P's own cores, mGBA and DraStic, built by the a133p-cores workflow.
      - name: Take the A133P cores
        run: |
          set -eu
          gh release download a133p-cores --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" \
            --pattern 'a133p-cores.tar.gz' --pattern 'a133p-cores.tar.gz.sha256'
          (cd "$RUNNER_TEMP" && sha256sum -c a133p-cores.tar.gz.sha256)
          mkdir -p target-a133p
          tar -xzf "$RUNNER_TEMP/a133p-cores.tar.gz" -C target-a133p

      - name: Build the card
        env:
          UNSLOT_SS_DEVID: ${{ secrets.UNSLOT_SS_DEVID }}
          UNSLOT_SS_DEVPASSWORD: ${{ secrets.UNSLOT_SS_DEVPASSWORD }}
        run: |
          set -eu
          unzip -q "h700/unslot-${GITHUB_REF_NAME}-h700.zip"
          task dist:a133p FROM="unslot-${GITHUB_REF_NAME}" OUT="unslot-${GITHUB_REF_NAME}-a133p" \
            VERSION="${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}-a133p"
          file "$out/System/slot" | grep -q aarch64
          test "$(cat "$out/System/version")" = "$GITHUB_REF_NAME"
          sh tools/a133p/check-glibc.sh "$out/System/slot"
          # Everything a game runs on has to load on the firmware's glibc 2.33 and the libstdc++
          # of GCC 10 it has.
          newest() { objdump -T "$1" | grep -o "$2_[0-9.]*" | sed "s/$2_//" | sort -uV | tail -n 1; }
          fits() { [ -z "$1" ] || [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$2" ]; }
          for f in "$out"/System/*_libretro.so "$out"/System/bin/zip "$out"/System/drastic/drastic \
            "$out"/System/drastic/libs/*.so* "$out"/System/lib/*.so*; do
            test -f "$f"
            fits "$(newest "$f" GLIBC)" 2.33 || { echo "$f needs a newer glibc than 2.33" >&2; exit 1; }
            fits "$(newest "$f" GLIBCXX)" 3.4.28 || { echo "$f needs a newer libstdc++" >&2; exit 1; }
          done
          test "$(ls "$out"/System/*_libretro.so | wc -l)" -ge 47
          test -x "$out/.tmp_update/updater"
          test -f "$out/System/a133p/launch.sh"
          test -s "$out/System/licenses/drastic.meta"
          test -s "$out/System/licenses/portmaster-a133p.manifest"
          # The H700's PPSSPP hangs on the A133P's GPU, so a PSP game is refused rather than run.
          test ! -e "$out/System/ppsspp"

      - name: Package
        id: package
        env:
          UNSLOT_PAK_KEY: ${{ secrets.UNSLOT_PAK_KEY }}
        run: |
          set -eu
          out="unslot-${GITHUB_REF_NAME}-a133p"
          zip="$out.zip"
          zip -qry "$zip" "$out"
          sh tools/update/pack.sh "$out" MinUI-a133p.zip a133p
          test -n "$UNSLOT_PAK_KEY" || { echo "UNSLOT_PAK_KEY is not set" >&2; exit 1; }
          pak="$out.pak"
          cargo run -q --release -p slot --no-default-features --example make_pak -- \
            MinUI-a133p.zip "$GITHUB_REF_NAME" "$pak"
          test -f "$pak"
          sha256sum "$zip" "$pak" > SHA256SUMS-a133p
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "pak=$pak" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: a133p-files
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.pak }}
            SHA256SUMS-a133p
          if-no-files-found: error

  publish:
    name: release
    needs: [build, a133p]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v8
        with:
          name: release-files

      - uses: actions/download-artifact@v8
        with:
          name: a133p-files

      # Keep the assets out of the public updater until the signed pack has been checked on-device.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
          PAK: ${{ needs.build.outputs.pak }}
          A133P_ZIP: ${{ needs.a133p.outputs.zip }}
          A133P_PAK: ${{ needs.a133p.outputs.pak }}
        run: |
          set -eu
          # One manifest for every asset, the TrimUI card's with the H700's.
          cat SHA256SUMS-a133p >> SHA256SUMS
          # What the release is and how to install it, from .github/release-notes.md.
          sed "s/\$TAG/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$PAK" MinUI.zip "$A133P_ZIP" "$A133P_PAK" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --draft

  images:
    name: card images
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ github.ref_name }}
