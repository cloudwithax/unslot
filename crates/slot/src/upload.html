<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141417">
<title>Send to unslot.</title>
<style>
:root{color-scheme:dark;--ground:#141417;--housing:#1d1d22;--recess:#0d0d10;--edge:#34343d;--edge-hi:#4d4d57;--ink:#f4f5f8;--muted:#b3b4c1;--faint:#8a8b99;--red:#e8473f;--red-hi:#ff5f56;--red-ink:#fff4f2;--plastic:#c2c6cc;--plastic-hi:#e9ecf0;--ok:#5fcf7a;--ease:cubic-bezier(.16,1,.3,1);--gutter:clamp(16px,4vw,40px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#e8473f14,transparent 60%),var(--ground);color:var(--ink);font:400 17px/1.65 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:var(--red-ink)}
.mast{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;padding:0 var(--gutter);background:color-mix(in srgb,var(--ground) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid color-mix(in srgb,var(--edge) 60%,transparent)}
.mast svg{height:22px;width:auto;display:block}
main{max-width:620px;margin:0 auto;padding:clamp(28px,6vh,56px) var(--gutter) 64px}
.eyebrow{font:800 .72rem/1 "Open Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 12px}
h1{margin:0;font-size:clamp(2rem,8vw,2.8rem);line-height:1.02;letter-spacing:-.04em}
.lede{color:var(--muted);margin:12px 0 28px}
.label{display:block;font:800 .7rem/1 "Open Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:none;color:var(--muted);font:800 .72rem/1 "Open Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:background-color .2s,color .2s,border-color .2s}
.chip:hover{color:var(--ink);border-color:var(--edge-hi)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,.drop:focus-within{outline:2px solid var(--red);outline-offset:3px}
.select{position:relative}
.select::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{appearance:none;-webkit-appearance:none;width:100%;height:50px;padding:0 44px 0 18px;border-radius:12px;border:1px solid var(--edge);background:var(--recess);color:var(--ink);font:600 1rem/1 "Open Sans",sans-serif}
.drop{position:relative;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;min-height:150px;padding:24px;border-radius:16px;border:1.5px dashed var(--edge-hi);background:var(--housing);box-shadow:inset 0 2px 10px #0006;transition:border-color .2s,background-color .2s;cursor:pointer}
.drop.over{border-color:var(--red);background:#e8473f10}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{font-size:1.05rem}
.drop small{color:var(--faint);font-size:.88rem}
.hint{color:var(--faint);font-size:.88rem;margin:10px 2px 0}
.btn{appearance:none;border:0;cursor:pointer;width:100%;margin-top:24px;min-height:52px;border-radius:999px;background:var(--red);color:var(--red-ink);font:800 .92rem/1 "Open Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;box-shadow:inset 0 1px #ffffff47,inset 0 -2px #00000038,0 6px 18px -6px #e8473f99,0 2px 4px #0006;transition:transform .35s var(--ease),background-color .2s}
.btn:hover{background:var(--red-hi);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
#log{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--edge)}
#log li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 2px;border-bottom:1px solid color-mix(in srgb,var(--edge) 55%,transparent);font-size:.94rem}
#log .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log .state{color:var(--muted);font-variant-numeric:tabular-nums}
#log .ok .state{color:var(--ok)}
#log .bad .state{color:var(--red-hi)}
#log .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--recess);overflow:hidden}
#log .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
#log .ok .bar i{background:var(--ok)}
.where{margin-top:12px;border-radius:16px;border:1px solid var(--edge);background:var(--housing);overflow:hidden}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:10px 12px;border-bottom:1px solid var(--edge);font-size:.92rem}
.crumbs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem/1.4 "Open Sans",sans-serif;padding:4px 6px;border-radius:6px;cursor:pointer}
.crumbs button:last-child{color:var(--ink)}
.crumbs button:hover{background:var(--recess)}
.crumbs span{color:var(--faint)}
#folders{list-style:none;margin:0;padding:4px 0;max-height:260px;overflow-y:auto}
#folders button{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--ink);font:600 .98rem/1.3 "Open Sans",sans-serif;text-align:left;cursor:pointer}
#folders button:hover{background:var(--recess)}
#folders svg{flex:none;width:20px;height:20px;fill:var(--plastic)}
#folders small{margin-left:auto;color:var(--faint);font-weight:400}
#folders .none{padding:14px 16px;color:var(--faint);font-size:.9rem}
.mkdir{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--edge)}
.mkdir input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--edge);background:var(--recess);color:var(--ink);font:400 .95rem/1 "Open Sans",sans-serif}
.mkdir button,.pick-dir{appearance:none;cursor:pointer;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge-hi);background:none;color:var(--ink);font:800 .7rem/1 "Open Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.pick-dir{position:relative;z-index:1;margin-top:8px}
.room{color:var(--faint);font-size:.86rem;margin:8px 2px 0}
</style></head>
<body>
<header class="mast" aria-label="unslot.">{BRAND}</header>
<main>
<p class="eyebrow">Upload from Phone</p>
<h1>Send it to your handheld.</h1>
<p class="lede">Send any file or a whole folder. Sort for Me puts games on their system's shelf and music, books, pictures and videos where their apps look; or pick a folder on the card yourself.</p>

<span class="label" id="kind-label">What are you sending?</span>
<div class="chips" role="group" aria-labelledby="kind-label">
<button class="chip" type="button" data-kind="files" aria-pressed="true">Files</button>
<button class="chip" type="button" data-kind="bezel" aria-pressed="false">Bezel</button>
<button class="chip" type="button" data-kind="wallpaper" aria-pressed="false">Wallpaper</button>
<button class="chip" type="button" data-kind="bootlogo" aria-pressed="false">Boot logo</button>
</div>

<div id="where-field">
<span class="label" id="where-label">Where to?</span>
<div class="chips" role="group" aria-labelledby="where-label">
<button class="chip where-chip" type="button" data-where="sort" aria-pressed="true">Sort for me</button>
<button class="chip where-chip" type="button" data-where="folder" aria-pressed="false">Pick a folder</button>
</div>
<div class="where" id="browser" hidden>
<nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
<ul id="folders"></ul>
<form class="mkdir" id="mkdir"><input id="mkdir-name" placeholder="New folder" autocomplete="off" aria-label="New folder name"><button type="submit">Make</button></form>
</div>
<p class="room" id="room"></p>
</div>

<div id="system-field">
<label class="label" for="system">System</label>
<div class="select"><select id="system">{SYSTEMS}</select></div>
</div>

<span class="label">Files</span>
<label class="drop" id="drop">
<input id="files" type="file" multiple>
<b id="drop-title">Choose files</b>
<small id="drop-note">or drop them, or whole folders, here</small>
</label>
<input id="dir" type="file" webkitdirectory multiple hidden>
<button class="pick-dir" id="pick-dir" type="button">Choose a folder</button>
<p class="hint" id="hint"></p>

<button class="btn" id="go" type="button" disabled>Send</button>
<ul id="log" aria-live="polite"></ul>
</main>
<script>
const $=id=>document.getElementById(id);
const hints={
 files:"Unzip games first, except arcade, Neo Geo and CPS sets, and DOS and Amiga games packed that way. Sort for Me puts what nothing on the handheld opens in Downloads.",
 bezel:"A PNG the size of the screen, with a clear window for the game. Send its .info too if it has one, or a RetroArch overlay's .cfg with its PNG.",
 wallpaper:"A PNG or a JPEG. It becomes the wallpaper as soon as it arrives.",
 bootlogo:"A PNG, a JPEG or a BMP, up to 8 MiB. It becomes the boot logo as soon as it arrives."
};
const accept={files:"",bezel:".png,.info,.cfg",wallpaper:".png,.jpg,.jpeg",bootlogo:".png,.jpg,.jpeg,.bmp"};
const FOLDER_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
let kind="files",where="sort",dir="",picked=[];
const hidden=path=>path.split("/").some(p=>p.startsWith("."));
function size(b){const u=["B","KB","MB","GB","TB"];let i=0;while(b>=1024&&i<4){b/=1024;i++}return(i?b.toFixed(1):b)+" "+u[i]}
function pick(k){
 kind=k;
 document.querySelectorAll("[data-kind]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.kind===k));
 $("system-field").hidden=k!=="bezel";
 $("where-field").hidden=k!=="files";
 $("pick-dir").hidden=k!=="files";
 $("files").accept=accept[k];
 $("hint").textContent=hints[k];
 if(k!=="files")picked=picked.filter(f=>!f.path.includes("/"));
 chosen();
}
document.querySelectorAll("[data-kind]").forEach(c=>c.onclick=()=>pick(c.dataset.kind));
function aim(w){
 where=w;
 document.querySelectorAll("[data-where]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.where===w));
 $("browser").hidden=w!=="folder";
}
document.querySelectorAll("[data-where]").forEach(c=>c.onclick=()=>aim(c.dataset.where));
async function walk(to){
 const r=await fetch("/folders?path="+encodeURIComponent(to));
 if(!r.ok)return;
 const got=await r.json();
 dir=got.path;
 const crumbs=$("crumbs");crumbs.textContent="";
 const parts=dir?dir.split("/"):[];
 [["Card",""]].concat(parts.map((p,i)=>[p,parts.slice(0,i+1).join("/")])).forEach(([name,path],i)=>{
  if(i){const s=document.createElement("span");s.textContent="/";crumbs.append(s)}
  const b=document.createElement("button");b.type="button";b.textContent=name;b.onclick=()=>walk(path);crumbs.append(b);
 });
 const list=$("folders");list.textContent="";
 got.folders.forEach(f=>{
  const li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.innerHTML=FOLDER_ICON+"<span></span>"+(f.system?"<small></small>":"");
  b.querySelector("span").textContent=f.name;
  if(f.system)b.querySelector("small").textContent=f.system;
  b.onclick=()=>walk((dir?dir+"/":"")+f.name);
  li.append(b);list.append(li);
 });
 if(!got.folders.length){const li=document.createElement("li");li.className="none";li.textContent="No folders in here. Files sent now land right here.";list.append(li)}
 $("room").textContent=got.free==null?"":size(got.free)+" free on the card";
}
$("mkdir").onsubmit=async ev=>{
 ev.preventDefault();
 const name=$("mkdir-name").value.trim();
 if(!name||name.includes("/")||name.startsWith("."))return;
 const path=(dir?dir+"/":"")+name;
 const r=await fetch("/folder?path="+encodeURIComponent(path),{method:"POST"});
 if(r.ok){$("mkdir-name").value="";walk(path)}
};
function chosen(){
 const n=picked.length,total=picked.reduce((a,f)=>a+f.file.size,0);
 $("drop-title").textContent=n?n+(n===1?" file chosen":" files chosen")+", "+size(total):"Choose files";
 $("drop-note").textContent=n?picked.slice(0,6).map(f=>f.path).join(", ")+(n>6?" and "+(n-6)+" more":""):"or drop them, or whole folders, here";
 $("go").disabled=!n;
}
function add(list){
 list.filter(f=>!hidden(f.path)).forEach(f=>picked.push(f));
 chosen();
}
$("files").onchange=()=>{add([...$("files").files].map(file=>({file,path:file.name})));$("files").value=""};
$("pick-dir").onclick=()=>$("dir").click();
$("dir").onchange=()=>{add([...$("dir").files].map(file=>({file,path:file.webkitRelativePath||file.name})));$("dir").value=""};
// A dropped folder is read through its entries, as a drop only lists its top.
function entries(entry,path){
 if(entry.isFile)return new Promise(ok=>entry.file(file=>ok([{file,path:path+entry.name}]),()=>ok([])));
 const reader=entry.createReader(),all=[];
 return new Promise(ok=>{
  const more=()=>reader.readEntries(async batch=>{
   if(!batch.length){ok((await Promise.all(all.map(e=>entries(e,path+entry.name+"/")))).flat());return}
   all.push(...batch);more();
  },()=>ok([]));
  more();
 });
}
const drop=$("drop");
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,()=>drop.classList.remove("over")));
drop.addEventListener("drop",async ev=>{
 ev.preventDefault();
 const items=[...ev.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
 if(items.length)add((await Promise.all(items.map(e=>entries(e,"")))).flat().filter(f=>kind==="files"||!f.path.includes("/")));
 else add([...ev.dataTransfer.files].map(file=>({file,path:file.name})));
});
function row(name){
 const li=document.createElement("li");
 li.innerHTML='<span class="name"></span><span class="state">Waiting</span><span class="bar"><i></i></span>';
 li.querySelector(".name").textContent=name;
 $("log").prepend(li);
 return li;
}
function send(f,to,li){
 return new Promise(done=>{
  const x=new XMLHttpRequest();
  x.open("PUT","/upload?to="+encodeURIComponent(to)+"&name="+encodeURIComponent(kind==="files"?f.path:f.file.name));
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);li.querySelector("i").style.width=p+"%";li.querySelector(".state").textContent=p+"%"}};
  x.onload=()=>{const ok=x.status===200;li.classList.add(ok?"ok":"bad");li.querySelector("i").style.width="100%";li.querySelector(".state").textContent=x.responseText||x.status;done()};
  x.onerror=()=>{li.classList.add("bad");li.querySelector(".state").textContent="Could not reach the handheld";done()};
  x.send(f.file);
 });
}
$("go").onclick=async()=>{
 const sys=$("system").value;
 const to=kind==="bootlogo"?"bootlogo":kind==="wallpaper"?"{WALLPAPER}":kind==="bezel"?"{BEZEL}"+sys:where==="sort"?"{SORT}":"{FOLDER}"+dir;
 const files=picked;picked=[];
 $("go").disabled=true;
 const rows=files.map(f=>row(f.path));
 for(let i=0;i<files.length;i++)await send(files[i],to,rows[i]);
 chosen();
 if(kind==="files")walk(dir);
};
pick("files");
walk("");
</script>
</body></html>
